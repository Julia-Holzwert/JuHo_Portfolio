<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Julia Holzwert - Project</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
</head>

<body data-project-slug="healthyStart" class="project-page">

  <main class="case-page">

    <section class="intro-block case-hero">
      <div class="intro-container case-hero-inner">
        <div class="case-hero-copy">
          <p class="project-tags" id="projectTags"></p>
          <h1 id="projectTitle"></h1>
          <p id="projectMeta"></p>
        </div>
      </div>
    </section>

    <section id="projectCoverBanner" class="case-cover" hidden>
      <div class="project-cover-wrapper">
        <div class="project-cover-bg"></div>
        <div class="project-cover-image-frame">
          <img class="project-cover-img" src="" alt="">
        </div>
      </div>
    </section>

    <section id="projectExtraRect" class="case-editorial-gallery" hidden>
      <div class="project-extra-slider-wrap">
        <button class="project-extra-arrow project-extra-arrow-left" type="button" aria-label="Previous image">‹</button>

        <div class="project-extra-rect">
          <div class="project-extra-track"></div>
        </div>

        <button class="project-extra-arrow project-extra-arrow-right" type="button" aria-label="Next image">›</button>
      </div>
    </section>

    <section class="project-detail-section case-detail">
      <div class="project-detail-wrapper case-detail-wrapper">
        <aside class="project-text case-text" id="projectText"></aside>

        <div class="project-images case-media">
          <div class="image-grid case-image-grid" id="projectImages"></div>
        </div>
      </div>
    </section>

    <section class="other-projects-section case-more">
      <div class="other-projects-container">
        <h2>More Projects</h2>
        <div class="other-projects-grid" id="otherProjectsGrid"></div>
      </div>
    </section>

  </main>

  <button id="toTop">↑</button>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.20/dist/lenis.min.js"></script>

  <script src="../projects-data.js"></script>
  <script src="../script.js"></script>
</body>

</html>
